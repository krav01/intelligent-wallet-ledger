openapi: 3.1.0
info:
  title: Intelligent Wallet Ledger API
  version: 0.1.0
  description: |
    Operational and analyst-review endpoints for the intelligent-wallet-ledger demo.
    The analyst command is registered only when OIDC_ISSUER, OIDC_AUDIENCE, and
    OIDC_ROLE_CLAIM are configured together.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Report process health
      operationId: getHealth
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      summary: Report process readiness
      operationId: getReadiness
      responses:
        '200':
          description: Process is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/transfers/{transferID}/review-decision:
    post:
      summary: Decide an open transfer review case
      operationId: decideReviewCase
      description: |
        Requires a verified OIDC Bearer token with the configured audience, a
        nonempty subject, and the `analyst` value in the configured role claim. The
        command is rate limited per verified subject within one wallet-api process.
      security:
        - bearerAuth: []
      parameters:
        - name: transferID
          in: path
          required: true
          description: UUID of the transfer whose open review case is being decided.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '204':
          description: Decision was recorded atomically with the lifecycle transition, audit record, and outbox event.
        '400':
          description: Request body or decision is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bearer authentication is absent or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Verified principal does not have the analyst role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transfer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The review case is no longer open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The verified principal exceeded the review-decision command limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An internal dependency failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, declined]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
