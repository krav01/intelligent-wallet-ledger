name: Helm

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Lint and render chart
        run: |
          chart=deploy/helm/intelligent-wallet-ledger
          values=(
            --set image.repository=registry.example/intelligent-wallet-ledger
            --set image.digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          )
          helm lint "$chart" "${values[@]}"
          helm template wallet "$chart" "${values[@]}" >/dev/null
