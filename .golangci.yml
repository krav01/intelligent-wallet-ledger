version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - loggercheck
    - misspell
    - modernize
    - noctx
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
